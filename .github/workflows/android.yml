name: Android CI

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup permanent debug keystore
      run: |
        if [ ! -s app/debug.keystore ] || ! keytool -list -keystore app/debug.keystore -storepass android -alias androiddebugkey > /dev/null 2>&1; then
          rm -f app/debug.keystore
          keytool -genkeypair -v -keystore app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add app/debug.keystore
          git commit -m "ci: persist permanent debug keystore [skip ci]" || true
          git push || true
        fi

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.7'

    - name: Generate Gradle wrapper
      run: gradle wrapper --gradle-version 8.7

    - name: Build debug APK
      run: ./gradlew assembleDebug

    - name: Prepare APK artifact
      run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/PDF-to-Image.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PDF-to-Image-APK
        path: app/build/outputs/apk/debug/PDF-to-Image.apk

    - name: Publish Direct APK to GitHub Releases
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0
        name: "PDF to Image Converter v1.0.0"
        body: |
          ### PDF to Image Converter for Android
          - Direct `.apk` download (no extracting zip required)
          - Android 13+ compliant MediaStore gallery saving
          - High resolution PDF rendering
        files: app/build/outputs/apk/debug/PDF-to-Image.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
